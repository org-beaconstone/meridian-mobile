name: Verify browser companion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview/package-lock.json
      - run: npm ci
      - run: npm run check
