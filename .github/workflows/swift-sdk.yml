name: Swift SDK and desktop build
on: [push, pull_request]
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build
        working-directory: ios
      - run: swift run MeridianSDKChecks
        working-directory: ios
      - run: swift run MeridianContractChecks
        working-directory: ios
      - run: swift run MeridianScenarioChecks
        working-directory: ios
      - run: swift run MeridianSecurityChecks
        working-directory: ios
      - run: swift run MeridianA11yChecks
        working-directory: ios
