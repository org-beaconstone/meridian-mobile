name: Mock container journeys
on: [push, pull_request]
permissions:
  contents: read
jobs:
  kotlin-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start Spring Boot mock
        run: |
          set -euo pipefail
          mvn -B -f mock-container/pom.xml -DskipTests package
          java -jar mock-container/target/meridian-mock-container.jar > /tmp/mock.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mock.log
          exit 1
      - name: Run Kotlin journey
        run: mvn -B -f android/pom.xml -Dtest=ContainerJourneyTest test
        env:
          MERIDIAN_TEST_API: http://127.0.0.1:8080/api/v1
          MERIDIAN_REQUIRE_CONTAINER: "1"
  swift-journey:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start Spring Boot mock
        run: |
          set -euo pipefail
          mvn -B -f mock-container/pom.xml -DskipTests package
          java -jar mock-container/target/meridian-mock-container.jar > /tmp/mock.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mock.log
          exit 1
      - name: Run Swift desktop journey
        working-directory: ios
        run: swift run MeridianContainerChecks
        env:
          MERIDIAN_TEST_API: http://127.0.0.1:8080/api/v1
